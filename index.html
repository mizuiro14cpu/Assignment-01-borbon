<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BORBON Assignment 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">


        <form id="userForm" class="d-flex justify-content-center mb-2">
            <input id="quantityInput" type="number" min="1" max="1000"
                   placeholder="Enter number of random users"
                   class="form-control fixed-input rounded-pill text-center" />
        </form>

        <p id="messageElement" class="text-danger small text-center mb-3 d-none"></p>

        <div class="row text-center fw-semibold mb-2 gx-2">
            <div class="col">
                <select id="nameSelector" class="pill-select">
                    <option value="first">First Name</option>
                    <option value="last">Last Name</option>
                </select>
            </div>
            <div class="col"><div class="header-pill">Gender</div></div>
            <div class="col"><div class="header-pill">Email Address</div></div>
            <div class="col"><div class="header-pill">Country</div></div>
        </div>

        <div id="outputContainer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
